[package]
name = "sidekick"
version = "0.1.0"
description = "Sidekick – turns Ray-Ban Meta glasses into an audio interface for Claude Code"
authors = ["Lenny"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sidekick_lib"
# Desktop-only: `staticlib`/`cdylib` are only needed for Tauri mobile targets, and the
# cdylib link on windows-gnu exports every symbol (exceeds the PE ordinal limit).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
